# Canonical Site Regulatory Binder checklist.
#
# Scope: SITE-level essential documents (ICH E6(R2) §8, 21 CFR Part 312/812 analogues).
# Deliberately excludes subject-level source documents and CRFs — those live in the
# EDC/eISF, not the site regulatory binder, and are out of scope for this MVP wedge.
#
# expiry_policy:
#   none              -> document does not expire on its own (superseded by version only)
#   fixed_annual      -> expires N days after effective_date, renewal cadence is calendar-driven
#   protocol_defined  -> expiry is read from the document itself (e.g. IRB approval end date)
#   custom_days       -> expires N days after effective_date, N given by expiry_days
#
# alert_window_days: how many days before expiry the gap-checker should flag "expiring soon"

- id: irb_approval_letter
  name: "IRB/IEC Initial Approval Letter"
  category: ethics_committee
  required: true
  expiry_policy: protocol_defined
  alert_window_days: 60
  regulatory_basis: "ICH E6(R2) §8.2.3; 21 CFR 56.109"

- id: irb_continuing_review
  name: "IRB/IEC Continuing Review Approval"
  category: ethics_committee
  required: true
  expiry_policy: fixed_annual
  expiry_days: 365
  alert_window_days: 60
  regulatory_basis: "21 CFR 56.109(f)"

- id: irb_roster_or_assurance
