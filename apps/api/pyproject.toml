[project]
name = "trialready-api"
version = "0.1.0"
description = "TrialReady — regulatory binder gap-checker agent for independent clinical trial sites"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "python-multipart==0.0.12",
    "uvicorn[standard]==0.30.6",
    "pydantic[email]==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "asyncpg==0.29.0",
    "psycopg[binary]==3.2.2",
    "semantic-kernel==1.9.0",
    "azure-ai-documentintelligence==1.0.0b4",
    "azure-storage-blob==12.23.1",
    "azure-identity==1.17.1",
    "azure-keyvault-secrets==4.8.0",
    "azure-monitor-opentelemetry==1.6.4",  # pulls in a compatible opentelemetry-sdk itself
    "python-jose[cryptography]==3.3.0",
    "PyYAML==6.0.2",
    "structlog==24.4.0",
    "tenacity==9.0.0",
    "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "types-PyYAML==6.0.12.20240917",
    "faker==30.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --cov=trialready_api --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
